<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bientôt disponible</title>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url("img/testimonial/test-2-bg.jpeg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            color: white;
        }

        .coming-soon {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
        }

        .coming-soon h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .countdown {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .countdown-box {
            background-color: #C2A56D;
            color: #2D3743;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            width: 80px;
        }

        .countdown-box h2 {
            font-size: 24px;
            margin: 0;
        }

        .countdown-box p {
            font-size: 14px;
            margin: 5px 0 0;
        }

        .description {
            font-size: 16px;
            margin-top: 20px;
        }

        /* Responsive styles */
        @media (max-width: 850px) {
            /* body {
                background-size: contain;
            } */
            .coming-soon{
                margin:0 2rem;
            }
            .coming-soon h1 {
                font-size: 28px;
            }
            .countdown-box {
                width: 70px;
                padding: 15px;
            }

            .countdown-box h2 {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .countdown {
                flex-wrap: wrap;
                gap: 10px;
            }

            .countdown-box {
                width: calc(50% - 10px); /* Two boxes per row */
            }

            .description {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="coming-soon">
        <h1>Bientôt disponible</h1>
        <div class="countdown">
            <div class="countdown-box">
                <h2 id="days">00</h2>
                <p>Jours</p>
            </div>
            <div class="countdown-box">
                <h2 id="hours">00</h2>
                <p>Heures</p>
            </div>
            <div class="countdown-box">
                <h2 id="minutes">00</h2>
                <p>Minutes</p>
            </div>
            <div class="countdown-box">
                <h2 id="seconds">00</h2>
                <p>Secondes</p>
            </div>
        </div>
        <p class="description">Nous travaillons dur pour vous offrir quelque chose d'incroyable. Restez à l'écoute !</p>
    </div>

    <script>
        // Set the target date for the countdown
        const targetDate = new Date("2025-12-31T23:59:59").getTime();

        // Update the countdown every second
        const countdownInterval = setInterval(() => {
            const now = new Date().getTime();
            const timeLeft = targetDate - now;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                document.querySelector(".countdown").innerHTML = "<p>C'est arrivé !</p>";
                return;
            }

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = days.toString().padStart(2, "0");
            document.getElementById("hours").textContent = hours.toString().padStart(2, "0");
            document.getElementById("minutes").textContent = minutes.toString().padStart(2, "0");
            document.getElementById("seconds").textContent = seconds.toString().padStart(2, "0");
        }, 1000);
    </script>
</body>
</html>
